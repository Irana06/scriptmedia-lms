<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B2545">
    <title>Tidak ada koneksi</title>
    <style>
        body { align-items: center; background: #F4FAFA; color: #172033; display: flex; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 16px; box-sizing: border-box; }
        main { background: #fff; border: 1px solid #DDE8E8; border-radius: 18px; box-shadow: 0 16px 40px -28px rgba(11, 37, 69, .42); max-width: 380px; padding: 32px 24px; text-align: center; }
        h1 { color: #0B2545; font-size: 20px; margin: 18px 0 8px; }
        p { color: #526070; font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
        button { background: #0B2545; border: 0; border-radius: 12px; color: #fff; cursor: pointer; font-size: 14px; font-weight: 600; min-height: 44px; padding: 0 20px; }
    </style>
</head>
<body>
    <main>
        <svg width="64" height="64" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#0B2545"/><path d="M160 262h192v72c0 26-43 44-96 44s-96-18-96-44z" fill="#2CA6A4"/><path d="M256 138 440 222 256 306 72 222z" fill="#F4A300"/><path d="M410 236v104" stroke="#F4A300" stroke-width="14" stroke-linecap="round"/><circle cx="410" cy="352" r="18" fill="#F4A300"/></svg>
        <h1>Tidak ada koneksi internet</h1>
        <p>Periksa sambungan data atau Wi-Fi, lalu coba lagi. Data sekolah hanya tampil saat tersambung.</p>
        <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
</body>
</html>
